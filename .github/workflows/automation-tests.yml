
name: Playwright UI and API Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  automation-tests:
    runs-on: ubuntu-latest

    env:
      TEST_ENV: qa
      QA_USERNAME: ${{ secrets.QA_USERNAME }}
      QA_PASSWORD: ${{ secrets.QA_PASSWORD }}
      UAT_USERNAME: ${{ secrets.UAT_USERNAME }}
      UAT_PASSWORD: ${{ secrets.UAT_PASSWORD }}
      API_USERNAME: ${{ secrets.API_USERNAME }}
      API_PASSWORD: ${{ secrets.API_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --frozen

      - name: Install Chromium
        run: uv run playwright install --with-deps chromium

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Allure CLI
        run: npm install -g allure@3.33.0

      - name: Run UI and API tests
        run: >
          uv run pytest tests/ -v
          -o "addopts=--browser=chromium
          --tracing=retain-on-failure
          --screenshot=only-on-failure
          --video=retain-on-failure
          -n 2
          --alluredir=allure-results
          --clean-alluredir"

      - name: Generate Allure report
        if: always()
        run: allure generate allure-results

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 14

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-artifacts
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
