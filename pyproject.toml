
[project]
name = "playwrightpythonautomation"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "allure-pytest>=2.16.2",
    "faker>=40.63.0",
    "pytest-check>=3.1.0",
    "pytest-playwright>=0.10.0",
    "pytest-xdist>=3.8.0",
    "python-dotenv>=1.2.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]

addopts = [
    "--browser=chromium",
    "--headed",
    "--tracing=retain-on-failure",
    "--screenshot=only-on-failure",
    "--video=retain-on-failure",
    "-n",
    "2",
    "--alluredir=allure-results",
    "--clean-alluredir",
]
